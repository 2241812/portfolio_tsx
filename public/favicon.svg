<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="24" fill="#08080a" />
  <!-- Outer Hexagonal Shield -->
  <polygon points="60,12 102,36 102,84 60,108 18,84 18,36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.4" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Inner Geometric Core -->
  <polygon points="60,26 90,43 90,77 60,94 30,77 30,43" fill="#12121a" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9" stroke-linecap="round" stroke-linejoin="round" />
  <!-- 3D Axial Connecting Vectors -->
  <line x1="60" y1="12" x2="60" y2="108" stroke="#00ADD8" stroke-width="2" stroke-opacity="0.8" />
  <line x1="18" y1="36" x2="102" y2="84" stroke="#00B4AB" stroke-width="2" stroke-opacity="0.8" />
  <line x1="18" y1="84" x2="102" y2="36" stroke="#00B4AB" stroke-width="2" stroke-opacity="0.8" />
  <line x1="60" y1="26" x2="60" y2="94" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="43" x2="90" y2="77" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <line x1="30" y1="77" x2="90" y2="43" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  <!-- Center & Vertex Focal Nodes -->
  <circle cx="60" cy="60" r="5" fill="#ffffff" />
  <circle cx="60" cy="26" r="3.5" fill="#00ADD8" />
  <circle cx="60" cy="94" r="3.5" fill="#00ADD8" />
  <circle cx="30" cy="43" r="3.5" fill="#00B4AB" />
  <circle cx="90" cy="43" r="3.5" fill="#00B4AB" />
  <circle cx="30" cy="77" r="3.5" fill="#00B4AB" />
  <circle cx="90" cy="77" r="3.5" fill="#00B4AB" />
</svg>
